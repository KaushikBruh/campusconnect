<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CampusConnect student and college portal"><title>Student Profile | CampusConnect</title><link rel="stylesheet" href="portal.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>campus<span class="brand-light">connect</span></span></a><nav><a href="index.html#events">Events</a><a href="index.html#clubs">Clubs</a><a href="announcements.html">Announcements</a></nav><div class="nav-actions"><a class="btn secondary" href="login.html">Student login</a><a class="btn" href="admin-login.html">Admin</a></div></header><main class="page-wrap"><div class="eyebrow">YOUR ACCOUNT</div><h1>Student profile</h1><p class="lead">Review your profile details. Account email is managed by the authentication provider.</p><div data-backend-notice class="notice hidden"></div><div id="profileMessage" class="notice hidden"></div><section class="panel" style="max-width:680px"><form id="profileForm"><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" maxlength="100" required></div><div class="field"><label for="student_id">Student / roll number</label><input id="student_id" name="student_id" maxlength="40" required></div><div class="field"><label>Email address</label><input id="email" disabled></div><button class="btn" data-auth-submit type="submit">Save profile</button></form><div class="actions"><a class="btn secondary" href="student-dashboard.html">Back to dashboard</a><button class="btn secondary" data-logout>Sign out</button></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{if(!ccAuth.client){ccAuth.showSetupNotice();return}const u=await ccAuth.requireUser();if(!u)return;document.getElementById('email').value=u.email||'';const p=await ccAuth.profile();document.getElementById('full_name').value=p?.full_name||u.user_metadata?.full_name||'';document.getElementById('student_id').value=p?.student_id||u.user_metadata?.student_id||'';document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await ccAuth.client.from('profiles').update({full_name:f.get('full_name').trim(),student_id:f.get('student_id').trim(),email:u.email}).eq('id',u.id);const m=document.getElementById('profileMessage');m.className='notice '+(error?'error':'success');m.textContent=error?error.message:'Profile saved successfully.'})});</script></main><footer class="footer"><span>CampusConnect · College Event & Club Portal</span><span><a href="about.html">About</a> · <a href="contact.html">Contact</a> · Academic project</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></body></html>
